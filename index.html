<style>
:root{--bg:#f6f1ec;--card:#fffaf6;--fg:#2b211c;--muted:#7d6d63;--accent:#a8502f;--line:#e6dbd2}
@media (prefers-color-scheme:dark){:root{--bg:#1b1512;--card:#241c18;--fg:#f1e7e0;--muted:#a8978c;--accent:#d97a52;--line:#3a2e28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:12px 16px 48px}
header h1{font:600 clamp(28px,5vw,46px)/1.1 Georgia,"Times New Roman",serif;margin:0 0 8px;color:var(--accent)}
header p{margin:0;color:var(--muted);max-width:720px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;margin:-12px 0 8px}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav a{color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;background:var(--card)}
nav a:hover{border-color:var(--accent);color:var(--accent)}
section{scroll-margin-top:64px;padding-top:24px;margin-top:24px;border-top:1px solid var(--line)} section:first-of-type{border-top:0;margin-top:0;padding-top:8px}
article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 18px}
h3{font-size:16px;font-weight:600;margin:0 0 10px}
.row{display:grid;gap:10px;align-items:start}
.row.c2{grid-template-columns:1fr 1fr} .row.c3{grid-template-columns:1fr 1fr 1fr}
figure{margin:0;min-width:0}
figure img{width:100%;height:auto;display:block;border-radius:8px;background:var(--line)}
figcaption{font-size:13px;color:var(--muted);margin-top:6px;letter-spacing:.02em}
figure.after figcaption{color:var(--accent);font-weight:600}
figure.none div{aspect-ratio:7/10;display:grid;place-items:center;text-align:center;padding:16px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:14px}
@media (max-width:640px){.row{gap:6px} article{padding:10px} figcaption{font-size:12px}}
footer{margin-top:48px;color:var(--muted);font-size:13px}
</style></head><body><div class="wrap">
